name: CI

on:
  push:
    branches:
      - main
      - test1
  pull_request:
    branches:
      - main
      - test1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scheduling tests
        run: npm run test:scheduling

      - name: Build
        run: npm run build
